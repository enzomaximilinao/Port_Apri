    <!-- Aplica tema e idioma antes da primeira pintura, sem piscar -->
    <script>
        (function () {
            var root = document.documentElement;
            var theme = "dark";
            var lang = "pt";
            root.classList.add("js");
            try {
                if (localStorage.getItem("theme") === "light") theme = "light";
                var fromUrl = new URLSearchParams(location.search).get("lang");
                if (fromUrl === "en" || fromUrl === "pt") lang = fromUrl;
                else if (localStorage.getItem("lang") === "en") lang = "en";
            } catch (e) {}
            root.dataset.theme = theme;
            root.lang = lang === "en" ? "en" : "pt-BR";
            // Rede de segurança: se o script principal falhar, o conteúdo aparece mesmo assim.
            setTimeout(function () {
                if (!window.PORTFOLIO_READY) root.classList.add("failsafe");
            }, 3000);
        })();
    </script>
